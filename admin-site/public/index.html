<!doctype html>
<!-- Version: V1.3 (2026-10-05) — admin-site/public/index.html — V1.3 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyTech Admin</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/chart.umd.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231f5fbf%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card" autocomplete="on">
    <div class="brand"><span class="logo">S</span> SkyTech Admin</div>
    <p class="muted">Sign in to SkyTechCRM</p>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="logo">S</span> SkyTech Admin</div>
    <nav id="nav">
      <a data-view="dashboard">Dashboard</a>
      <a data-view="leads">Leads</a>
      <a data-view="companies">Companies</a>
      <a data-view="webpresence">Web presence</a>
      <a data-view="activities">Activities</a>
      <a data-view="demosites">Demo sites</a>
      <div class="nav-sep">Data quality</div>
      <a data-view="imports">Imports</a>
      <a data-view="duplicates">Possible duplicates <span id="dupBadge" class="nav-count hidden" title="Duplicates found right now"></span></a>
      <a data-view="audit">Audit log</a>
    </nav>
    <div class="sidebar-foot">
      <div id="who" class="muted"></div>
      <div id="mode" class="badge"></div>
      <button id="logout" class="btn small ghost">Sign out</button>
    </div>
  </aside>
  <main>
    <header class="topbar"><button id="menu" class="btn small ghost menu-btn" aria-label="Menu">&#9776;</button><h1 id="title">Dashboard</h1><div id="crumbs" class="crumbs"></div></header>
    <section id="view"></section>
  </main>
</div>

<div id="drawer" class="drawer hidden" role="dialog" aria-modal="true">
  <div class="drawer-panel">
    <div class="drawer-head"><h2 id="drawerTitle"></h2><button id="drawerClose" class="btn small ghost" aria-label="Close">&times;</button></div>
    <div id="drawerBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
